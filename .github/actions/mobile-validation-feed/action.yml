name: Signed Mobile release validation feed
description: Verify the four signed-release Mobile package artifacts for Field branch validation
inputs:
  token:
    description: Workflow token with read access to the upstream validation artifacts
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: python3 "${{ github.action_path }}/restore.py"
