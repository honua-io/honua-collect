name: Honua branch validation feeds
description: Verify the temporary Mobile and SDK packages for Field branch validation
inputs:
  token:
    description: Workflow token with read access to the upstream validation artifacts
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        repo=honua-io/honua-mobile
        run=45956969211
        artifact=15179501279
        revision=d9c07224f7013712baf6772cd939b8f20298d73a
        digest=1d3b2217ca65c769a801bfdb7f4124e10fd5ba666988f08cf33b4ef96e4186a0
        feed="$(mktemp -d "$RUNNER_TEMP/honua-mobile-feed.XXXXXX")"
        test "$(gh api "repos/$repo/actions/runs/$run" --jq '.head_sha + ":" + .conclusion')" = "$revision:success"
        test "$(gh api "repos/$repo/actions/artifacts/$artifact" --jq '(.workflow_run.id | tostring) + ":" + .digest')" = "$run:sha256:$digest"
        gh api "repos/$repo/actions/artifacts/$artifact/zip" > "$feed/packages.zip"
        (cd "$feed" && printf '%s  packages.zip\n' "$digest" | shasum -a 256 -c)
        unzip -q "$feed/packages.zip" -d "$feed"
        (
          cd "$feed"
          shasum -a 256 -c <<'HASHES'
        daabb687088a022f975b004e2594b5a29d5950f253366113ad35e470606d3418  Honua.Mobile.Maui.0.1.0-operationqueue.2.nupkg
        54820f443ec27d5352df99a6511d0c2f5e43e9a126249ceea3c6721fb487b877  Honua.Mobile.Offline.0.1.0-operationqueue.2.nupkg
        f8bf3a86dcc78b4baa365f81f51fc617e854b3ba40d328442f104be12cd2b7f1  Honua.Mobile.Sdk.0.1.0-operationqueue.2.nupkg
        HASHES
        )
        sdk_repo=honua-io/honua-sdk-dotnet
        sdk_run=45953326051
        sdk_artifact=15177499058
        sdk_revision=71441abb40fec1448d1c248788afbadd049d8059
        sdk_digest=fee487cd2f768a860ab15bf6622e0de5d094beb7cfc614cfe62ec20f9079077b
        sdk_feed="$(mktemp -d "$RUNNER_TEMP/honua-sdk-feed.XXXXXX")"
        test "$(gh api "repos/$sdk_repo/actions/runs/$sdk_run" --jq '.head_sha + ":" + .conclusion')" = "$sdk_revision:success"
        test "$(gh api "repos/$sdk_repo/actions/artifacts/$sdk_artifact" --jq '(.workflow_run.id | tostring) + ":" + .digest')" = "$sdk_run:sha256:$sdk_digest"
        gh api "repos/$sdk_repo/actions/artifacts/$sdk_artifact/zip" > "$sdk_feed/packages.zip"
        (cd "$sdk_feed" && printf '%s  packages.zip\n' "$sdk_digest" | shasum -a 256 -c)
        unzip -jq "$sdk_feed/packages.zip" '*.nupkg' -d "$sdk_feed"
        (
          cd "$sdk_feed"
          shasum -a 256 -c <<'HASHES'
        021211f9d2694acab4a73d6dbda79f17a8292a44c19d4f4d25d6b9fa07fe2d7c  Honua.Sdk.Abstractions.5.1.1-fieldforms.3.nupkg
        2b6e0172dc42a01e77067d2e7ea1c3d419fdc0d1e330d01eb63ebf17aa9e5b78  Honua.Sdk.Field.5.1.1-fieldforms.3.nupkg
        HASHES
        )
        python3 - "$feed" "$sdk_feed" <<'PY'
        import sys
        import xml.etree.ElementTree as ET
        tree = ET.parse("NuGet.config")
        name = "mobile-validation"
        ET.SubElement(tree.find("packageSources"), "add", key=name, value=sys.argv[1])
        mapping = ET.SubElement(tree.find("packageSourceMapping"), "packageSource", key=name)
        for assembly in ("Maui", "Offline", "Sdk"):
            ET.SubElement(mapping, "package", pattern=f"Honua.Mobile.{assembly}")
        name = "sdk-validation"
        ET.SubElement(tree.find("packageSources"), "add", key=name, value=sys.argv[2])
        mapping = ET.SubElement(tree.find("packageSourceMapping"), "packageSource", key=name)
        for assembly in ("Field", "Abstractions"):
            ET.SubElement(mapping, "package", pattern=f"Honua.Sdk.{assembly}")
        ET.indent(tree)
        tree.write("NuGet.config", encoding="utf-8", xml_declaration=True)
        PY
