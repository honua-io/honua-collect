name: Field on Apple platforms

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/field-apple.yml
      - src/**
      - Directory.Build.*
      - Directory.Packages.props
      - NuGet.config
      - global.json
  push:
    branches: [trunk]
    paths:
      - .github/workflows/field-apple.yml
      - src/**
      - Directory.Build.*
      - Directory.Packages.props
      - NuGet.config
      - global.json

permissions:
  contents: read
  packages: read

jobs:
  apple:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      NuGetPackageSourceCredentials_github-honua: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Install MAUI Apple workloads
        run: dotnet workload install maui-ios maui-maccatalyst
      - name: Build iOS simulator and Mac Catalyst apps
        run: |
          project=src/Honua.Field.App/Honua.Field.App.csproj
          dotnet build "$project" -p:FieldTargetFramework=net11.0-ios -p:RuntimeIdentifier=iossimulator-arm64
          dotnet build "$project" -p:FieldTargetFramework=net11.0-maccatalyst -p:RuntimeIdentifier=maccatalyst-arm64
      - name: Launch Field on iPhone and iPad simulators
        run: |
          app=$(find src/Honua.Field.App/bin/Debug/net11.0-ios/iossimulator-arm64 -maxdepth 1 -name '*.app' -type d)
          test -d "$app"
          results="$RUNNER_TEMP/field-ios-results"
          mkdir -p "$results"
          xcrun simctl list devices available --json > "$results/simulators.json"
          for family in iPhone iPad; do
            device=$(jq -er --arg family "$family" '
              .devices["com.apple.CoreSimulator.SimRuntime.iOS-27-2"]
              | map(select(.name | startswith($family)))
              | first
              | .udid
            ' "$results/simulators.json")
            xcrun simctl boot "$device"
            xcrun simctl bootstatus "$device" -b
            xcrun simctl install "$device" "$app"
            xcrun simctl launch "$device" io.honua.collect | tee "$results/$family-launch.txt"
            xcrun simctl io "$device" screenshot "$results/$family.png"
            xcrun simctl shutdown "$device"
          done
      - name: Upload iPhone and iPad smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: field-ios-results
          path: ${{ runner.temp }}/field-ios-results
          if-no-files-found: warn
