name: AWS iOS simulator artifacts
on:
  push:
    branches: [validation/aws-ios-live-artifacts]
    paths: [.github/workflows/aws-ios-artifacts.yml]
permissions:
  actions: read
  contents: read
  packages: read
jobs:
  apps:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: c6551c28995ed4f15cd9db92ec5df95938ae0da4
          persist-credentials: false
      - uses: ./.github/actions/mobile-validation-feed
        with:
          token: ${{ github.token }}
      - name: Check out the previous Field build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 6e3db0b0c48c63d1bdb6fd1d7f00c2030dc33c46
          path: field-previous
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios
      - name: Build both Field iOS simulator apps
        env:
          NuGetPackageSourceCredentials_github-honua: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}
        run: |
          for checkout in field-previous .; do
            pilot=()
            if [[ "$checkout" == "." ]]; then
              pilot=(-p:EnableAssignedWorkPilot=true)
            fi
            (cd "$checkout" && dotnet build src/Honua.Field.App/Honua.Field.App.csproj \
              -p:FieldTargetFramework=net11.0-ios -p:RuntimeIdentifier=iossimulator-arm64 \
              -p:RestoreConfigFile="$PWD/NuGet.config" "${pilot[@]}" \
              --configuration Debug --disable-build-servers)
            app=$(find "$checkout/src/Honua.Field.App/bin/Debug/net11.0-ios/iossimulator-arm64" -maxdepth 1 -name '*.app' -type d)
            test -d "$app"
            revision=6e3db0b0c48c63d1bdb6fd1d7f00c2030dc33c46
            if [[ "$checkout" == "." ]]; then
              revision=c6551c28995ed4f15cd9db92ec5df95938ae0da4
            fi
            test "$(git -C "$checkout" rev-parse HEAD)" = "$revision"
            ditto -c -k --keepParent "$app" "$RUNNER_TEMP/$revision.zip"
            (cd "$RUNNER_TEMP" && shasum -a 256 "$revision.zip" > "$revision.zip.sha256")
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aws-ios-simulator-apps
          path: |
            ${{ runner.temp }}/[a-f0-9]*.zip
            ${{ runner.temp }}/[a-f0-9]*.zip.sha256
          if-no-files-found: error
          retention-days: 7
