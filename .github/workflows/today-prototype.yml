name: Today Prototype

on:
  pull_request:
    paths:
      - 'docs/verification/today/**'
      - '.github/workflows/today-prototype.yml'

permissions:
  contents: read

jobs:
  chromium-regression:
    name: Phone and Tablet Chromium Regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install Playwright and its pinned Chromium build
        run: |
          test_dir="$RUNNER_TEMP/today-playwright"
          npm install --prefix "$test_dir" --no-save --ignore-scripts playwright@1.65.0
          "$test_dir/node_modules/.bin/playwright" install --with-deps chromium

      - name: Run offline request regression
        run: NODE_PATH="$RUNNER_TEMP/today-playwright/node_modules" node docs/verification/today/request-regression.cjs
