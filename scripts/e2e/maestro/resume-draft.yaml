appId: io.honua.collect
---
- launchApp
- tapOn: Records
- extendedWaitUntil:
    visible: 'Drafts [1-9][0-9]* .*'
    timeout: 15000
- tapOn:
    text: Draft
    index: 0
- assertVisible: ${INSPECTION_NAME}
- scrollUntilVisible:
    element:
      id: '(.*:id/)?choice_Open'
      checked: true
- assertVisible:
    id: '(.*:id/)?choice_Closed'
    checked: true
- scrollUntilVisible:
    element:
      id: '(.*:id/)?total'
      text: '2'
- scrollUntilVisible:
    element: 1 attached
- scrollUntilVisible:
    element: '21\.31000, -157\.81000.*'
- scrollUntilVisible:
    element: Offline visit one
- scrollUntilVisible:
    element: Offline visit two
- scrollUntilVisible:
    element: Submit
- tapOn: Submit
- extendedWaitUntil:
    visible: 'Saved to Outbox.*'
    timeout: 15000
