appId: io.honua.collect
---
- launchApp
- extendedWaitUntil:
    visible: Geometry
    timeout: 60000
- tapOn: Geometry
- assertVisible: Capture geometry
- tapOn:
    id: GeometryType
# UIKit exposes only the selected wheel row. The iPhone hierarchy also
# matches the field behind the picker, so tap the third row by position.
- runFlow:
    when:
      true: ${FAMILY == "iPhone"}
    commands:
      - tapOn:
          point: 50%,95%
- runFlow:
    when:
      true: ${FAMILY == "iPad"}
    commands:
      - tapOn:
          text: Point
          index: -1
          point: 50%,70%
- assertVisible: Polygon
- tapOn:
    text: Done
    childOf:
      id: DoneAccessory
- assertVisible: 'Polygon: 0 vertex\(es\)'
- tapOn:
    point: 25%,30%
- tapOn:
    point: 52%,32%
- tapOn:
    point: 33%,58%
- assertVisible: 'Polygon: 3 vertex\(es\) ✓'
- takeScreenshot: polygon
- tapOn: Done
- assertVisible: Geometry captured
- assertVisible: '.*"type"\s*:\s*"Polygon".*'
- tapOn: OK
- tapOn: Undo
- assertVisible: 'Polygon: 2 vertex\(es\)'
- takeScreenshot: undo
