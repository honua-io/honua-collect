appId: io.honua.collect
---
- launchApp
- extendedWaitUntil:
    visible: Geometry
    timeout: 60000
- tapOn: Geometry
- assertVisible: Capture geometry
- tapOn:
    id: GeometryType
# UIKit exposes only the selected wheel row. Tap the third row inside the wheel.
- tapOn:
    text: Point
    index: -1
    point: 50%,70%
- assertVisible: Polygon
- tapOn:
    text: Done
    childOf:
      id: DoneAccessory
- assertVisible: 'Polygon: 0 vertex\(es\)'
- tapOn:
    point: 25%,30%
- tapOn:
    point: 52%,32%
- tapOn:
    point: 33%,58%
- assertVisible: 'Polygon: 3 vertex\(es\) ✓'
- takeScreenshot: polygon
- tapOn: Done
- assertVisible: Geometry captured
- assertVisible: '.*"type"\s*:\s*"Polygon".*'
- tapOn: OK
- tapOn: Undo
- assertVisible: 'Polygon: 2 vertex\(es\)'
- takeScreenshot: undo
