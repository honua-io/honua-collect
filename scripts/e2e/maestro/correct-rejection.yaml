appId: io.honua.collect
---
- launchApp
- tapOn: Records
- extendedWaitUntil:
    visible: 'Rejected\. Open to correct\..*'
    timeout: 15000
- tapOn: 'Rejected\. Open to correct\..*'
- assertVisible: ${INSPECTION_NAME}
- scrollUntilVisible:
    element:
      id: '(.*:id/)?choice_Open'
      checked: true
- assertVisible:
    id: '(.*:id/)?choice_Closed'
    checked: true
- scrollUntilVisible:
    element:
      id: '(.*:id/)?total'
      text: '2'
- scrollUntilVisible:
    element: 1 attached
- scrollUntilVisible:
    element: '21\.31000, -157\.81000.*'
- scrollUntilVisible:
    element: Offline visit one
- scrollUntilVisible:
    element: Offline visit two
- scrollUntilVisible:
    direction: UP
    element:
      id: '(.*:id/)?name'
- longPressOn:
    id: '(.*:id/)?name'
- runFlow:
    when:
      notVisible: '(?i)select all'
    commands:
      - tapOn: '(?i)more options'
- tapOn: '(?i)select all'
- eraseText: 1
- inputText: ${CORRECTED_NAME}
- assertVisible:
    id: '(.*:id/)?name'
    text: '^${CORRECTED_NAME}$'
- hideKeyboard
- scrollUntilVisible:
    element: Submit
- tapOn: Submit
- extendedWaitUntil:
    visible: 'Drafts [0-9]+ · Outbox [1-9][0-9]* .*'
    timeout: 15000
