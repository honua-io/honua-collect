appId: io.honua.collect
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: Start New Inspection
    timeout: 90000
- tapOn: Start New Inspection
- tapOn:
    id: 'name'
- inputText: ${INSPECTION_NAME}
- pressKey: Enter
- tapOn:
    id: 'choice_Open'
- tapOn:
    id: 'choice_Closed'
- scrollUntilVisible:
    element:
      id: 'total'
      text: '2'
- scrollUntilVisible:
    element: Add photo
- tapOn: Add photo
- tapOn: Choose from gallery
- extendedWaitUntil:
    visible: '(Photos|Photo Library)'
    timeout: 20000
# The clean simulator Photos library contains only the seeded inspection image.
- tapOn:
    point: 12%,26%
- extendedWaitUntil:
    visible: Skip
    timeout: 20000
- tapOn: Skip
- assertVisible: 1 attached
- scrollUntilVisible:
    element: Capture current location
- tapOn: Capture current location
- extendedWaitUntil:
    visible: '21\.31000, -157\.81000.*'
    timeout: 25000
- scrollUntilVisible:
    element: Add
- tapOn: Add
- tapOn: Add
- scrollUntilVisible:
    element:
      id: 'note'
- tapOn:
    id: 'note'
    index: 0
- inputText: Offline visit one
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: 'note'
      index: 1
- tapOn:
    id: 'note'
    index: 1
- inputText: Offline visit two
- pressKey: Enter
- scrollUntilVisible:
    element: Save draft
- tapOn: Save draft
- extendedWaitUntil:
    visible: Draft saved. Open Records to continue.
    timeout: 15000
- tapOn: Records
- extendedWaitUntil:
    visible: Drafts 1 · Outbox 0 · Conflicts 0 · Sent 0
    timeout: 15000
