appId: io.honua.collect
---
- launchApp
- extendedWaitUntil:
    visible: Start New Inspection
    timeout: 90000
- tapOn: Start New Inspection
- tapOn:
    id: '(.*:id/)?name'
- inputText: ${INSPECTION_NAME}
- hideKeyboard
- tapOn:
    id: '(.*:id/)?choice_Open'
- tapOn:
    id: '(.*:id/)?choice_Closed'
- scrollUntilVisible:
    element:
      id: '(.*:id/)?total'
      text: '2'
- tapOn: Add photo
- tapOn: Choose from gallery
- tapOn:
    id: '.*:id/(icon_thumbnail|thumbnail)'
    index: 0
- tapOn: Skip
- assertVisible: 1 attached
- scrollUntilVisible:
    element: Capture current location
- tapOn: Capture current location
- extendedWaitUntil:
    visible: '21\.31000, -157\.81000.*'
    timeout: 25000
- scrollUntilVisible:
    element: Add
- tapOn: Add
- tapOn: Add
- scrollUntilVisible:
    element:
      id: '(.*:id/)?note'
- runFlow:
    when:
      true: ${LEGACY_CAPTURE == 'true'}
    commands:
      - tapOn:
          id: '(.*:id/)?note'
          index: 0
      - inputText: Offline visit one
      - hideKeyboard
- runFlow:
    when:
      true: ${LEGACY_CAPTURE != 'true'}
    commands:
      - assertVisible:
          id: '(.*:id/)?note'
          text: Offline visit one
          index: 0
- scrollUntilVisible:
    element:
      id: '(.*:id/)?note'
      index: 1
- runFlow:
    when:
      true: ${LEGACY_CAPTURE != 'true'}
    commands:
      - assertVisible:
          id: '(.*:id/)?note'
          text: Offline visit one
          index: 1
- tapOn:
    id: '(.*:id/)?note'
    index: 1
- eraseText
- inputText: Offline visit two
- hideKeyboard
- scrollUntilVisible:
    element: Save draft
- tapOn: Save draft
- extendedWaitUntil:
    visible: Start New Inspection
    timeout: 15000
