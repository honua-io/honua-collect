appId: io.honua.collect
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: Records
    timeout: 90000
- tapOn: Records
- extendedWaitUntil:
    visible: 'Drafts [1-9][0-9]* .*'
    timeout: 15000
- tapOn:
    text: Draft
    index: 0
- assertVisible: ${INSPECTION_NAME}
- scrollUntilVisible:
    element:
      id: 'choice_Open'
- assertVisible:
    id: 'choice_Closed'
- scrollUntilVisible:
    element:
      id: 'total'
      text: '2'
- scrollUntilVisible:
    element: 1 attached
- scrollUntilVisible:
    element: '21\.31000, -157\.81000.*'
- scrollUntilVisible:
    element: Offline visit one
- scrollUntilVisible:
    element: Offline visit two
# Keep the action clear of the floating iOS tab bar before tapping.
- scrollUntilVisible:
    element: Submit
    visibilityPercentage: 100
- swipe:
    start: 90%,76%
    end: 90%,57%
    duration: 450
- assertVisible: Submit
- takeScreenshot: resume-draft-ios-before-action
- tapOn:
    text: Submit
    retryTapIfNoChange: false
- takeScreenshot: resume-draft-ios-after-action
- extendedWaitUntil:
    visible: 'Drafts [0-9]+ · Outbox [1-9][0-9]* .*'
    timeout: 15000
